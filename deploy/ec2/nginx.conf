# Replace certiblank.example.com with your actual hostname before enabling.
# Bootstrap HTTP config: obtain TLS with Certbot before allowing user traffic.
server {
    listen 80;
    listen [::]:80;
    server_name certiblank.example.com;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Avoid logging query strings (OAuth codes, callback parameters).
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Certiblank-Client-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
